services:
  - type: web
    name: complisense-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        fromDatabase:
          name: complisense-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: EVIDENCE_IN_DATABASE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_INSPECTOR_EMAIL
        sync: false
      - key: BOOTSTRAP_INSPECTOR_PASSWORD_HASH
        sync: false
      - key: BOOTSTRAP_REVIEWER_EMAIL
        sync: false
      - key: BOOTSTRAP_REVIEWER_PASSWORD_HASH
        sync: false

databases:
  - name: complisense-db
    databaseName: complisense
    user: complisense
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
